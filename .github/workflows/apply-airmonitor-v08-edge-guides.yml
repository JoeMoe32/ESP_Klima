name: Apply AirMonitor V0.8 edge-guide correction

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/apply-airmonitor-v08-edge-guides.yml"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/apply_v08_edge_guides_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.8 branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0

      - name: Apply edge-guide source and documentation patch
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: python apply_v08_edge_guides_patch.py

      - name: Commit patched V0.8 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.8
          if git diff --cached --quiet; then
            echo "V0.8 edge-guide patch already applied."
            exit 0
          fi
          git commit -m "Move V0.8 lid guides to edges and flush outer contour"
          git pull --rebase origin cad/airmonitor-compact-v0.8
          git push origin HEAD:cad/airmonitor-compact-v0.8
