name: Finalize AirMonitor V0.8 no-C lid

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/finalize-airmonitor-v08-no-c.yml"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/apply_v08_open_notches_to_edge.py"

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.8 branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply definitive no-C correction
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: python apply_v08_open_notches_to_edge.py

      - name: Install CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.5.2 reportlab==4.2.5

      - name: Validate and regenerate all V0.8 outputs
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: |
          python check_clearances.py
          python build_v08.py
          python generate_mass_sketches_v08.py
          test -f 02_CAD_Print/P02_Compact_Lid_Print_NO_C_V0.8.stl
          test -f LID_NO_C_VERIFICATION.txt
          grep -q "Lower-bar CAD probe: 0.000 mm3" LID_NO_C_VERIFICATION.txt

      - name: Commit corrected source and generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.8
          if git diff --cached --quiet; then
            echo "No-C V0.8 files already current."
            exit 0
          fi
          git commit -m "Open V0.8 lid notches straight to skirt edge"
          git push origin HEAD:cad/airmonitor-compact-v0.8
