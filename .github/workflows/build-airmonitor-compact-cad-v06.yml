name: Build AirMonitor Compact CAD V0.6

on:
  workflow_dispatch:
  push:
    branches:
      - cad/airmonitor-compact-v0.6
    paths:
      - "hardware/cad/AirMonitor_Compact_Revision_V0.6/**"
      - ".github/workflows/build-airmonitor-compact-cad-v06.yml"

permissions:
  contents: write

jobs:
  build-cad:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.6 CAD branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.6
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CadQuery
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.5.2

      - name: Validate and generate STEP STL
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.6
        run: python build_v06.py

      - name: Commit generated V0.6 CAD files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.6
          if git diff --cached --quiet; then
            echo "CAD outputs already current."
            exit 0
          fi
          git commit -m "Generate centered rear-panel holder revision V0.6"
          git push origin HEAD:cad/airmonitor-compact-v0.6
