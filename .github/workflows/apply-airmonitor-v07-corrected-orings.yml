name: Apply corrected AirMonitor V0.7 O-ring design

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.7
    paths:
      - ".github/workflows/apply-airmonitor-v07-corrected-orings.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.7 CAD branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.7
          fetch-depth: 0

      - name: Expand corrected V0.7 source package
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.7
        run: python apply_v07_corrected_payload.py

      - name: Remove temporary package files
        run: |
          rm -f hardware/cad/AirMonitor_Compact_Revision_V0.7/apply_v07_corrected_payload.py
          rm -f hardware/cad/AirMonitor_Compact_Revision_V0.7/v07_corrected_payload.part*
          rm -f .github/workflows/apply-airmonitor-v07-corrected-orings.yml

      - name: Commit corrected V0.7 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct V0.7 Y-centering and add purchased EPDM O-rings"
          git push origin HEAD:cad/airmonitor-compact-v0.7
