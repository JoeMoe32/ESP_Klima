name: Build AirMonitor V0.8 open-top side wall

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/build-airmonitor-v08-open-top-side.yml"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/apply_v08_remove_122mm_side_bridge.py"

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.8 branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply open-top side-wall correction
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: python apply_v08_remove_122mm_side_bridge.py

      - name: Install CAD PDF and render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.5.2 reportlab==4.2.5 matplotlib==3.10.7 numpy==2.4.6 pypdfium2==5.1.0 pillow==13.0.0

      - name: Validate regenerate and render V0.8
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: |
          python check_clearances.py
          python build_v08.py
          python generate_mass_sketches_v08.py
          python verify_v08_mass_sketches.py
          python render_v08.py
          test -f 02_CAD_Print/P01_Compact_Base_Print_OPEN_TOP_V0.8.stl
          test -f 02_CAD_Print/P01_Compact_Base_Print_OPEN_TOP_V0.8.step
          test -f SIDE_OPENING_VERIFICATION.txt
          test -f 03_Renders_Drawings/MassSketch_V08_Page02_OpenTopSide.png
          grep -q "Upper horizontal bridge: removed" SIDE_OPENING_VERIFICATION.txt
          grep -q "Bridge volume front: 0.000 mm3" SIDE_OPENING_VERIFICATION.txt
          grep -q "Bridge volume rear: 0.000 mm3" SIDE_OPENING_VERIFICATION.txt
          grep -q "Open-top longitudinal wall correction: page 2" MASS_SKETCH_VERIFICATION.txt

      - name: Upload corrected V0.8 package
        uses: actions/upload-artifact@v4
        with:
          name: airmonitor-v08-open-top-side
          if-no-files-found: error
          retention-days: 7
          path: |
            hardware/cad/AirMonitor_Compact_Revision_V0.8/AirMonitor_V08_Massskizzen_1zu1.pdf
            hardware/cad/AirMonitor_Compact_Revision_V0.8/02_CAD_Print/P01_Compact_Base_Print_OPEN_TOP_V0.8.stl
            hardware/cad/AirMonitor_Compact_Revision_V0.8/02_CAD_Print/P01_Compact_Base_Print_OPEN_TOP_V0.8.step
            hardware/cad/AirMonitor_Compact_Revision_V0.8/03_Renders_Drawings/MassSketch_V08_Page02_OpenTopSide.png
            hardware/cad/AirMonitor_Compact_Revision_V0.8/03_Renders_Drawings/MassSketches_V08_ContactSheet.png
            hardware/cad/AirMonitor_Compact_Revision_V0.8/03_Renders_Drawings/Drawing_V08_Overlap_Lid_Side.svg
            hardware/cad/AirMonitor_Compact_Revision_V0.8/SIDE_OPENING_VERIFICATION.txt
            hardware/cad/AirMonitor_Compact_Revision_V0.8/MASS_SKETCH_VERIFICATION.txt

      - name: Commit corrected CAD sketches and renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.8
          if git diff --cached --quiet; then
            echo "V0.8 open-top side-wall outputs already current."
            exit 0
          fi
          git commit -m "Remove unprintable 122 mm side-wall bridge in V0.8"
          git push origin HEAD:cad/airmonitor-compact-v0.8
