name: Apply AirMonitor V0.8 enclosure redesign

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/apply-airmonitor-v08-redesign.yml"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/run_v08_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.8 branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0

      - name: Apply V0.8 source, sketch and documentation changes
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: |
          python run_v08_patch.py
          rm -f apply_v08_redesign.py apply_v08_redesign_fixed.py run_v08_patch.py

      - name: Commit V0.8 source package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.8
          if git diff --cached --quiet; then
            echo "V0.8 redesign already applied."
            exit 0
          fi
          git commit -m "Create V0.8 rounded 10 mm overlap enclosure"
          git pull --rebase origin cad/airmonitor-compact-v0.8
          git push origin HEAD:cad/airmonitor-compact-v0.8
