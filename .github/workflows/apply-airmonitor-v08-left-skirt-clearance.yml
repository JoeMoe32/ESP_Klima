name: Apply AirMonitor V0.8 left-skirt clearance fix

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/apply-airmonitor-v08-left-skirt-clearance.yml"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/fix_v08_left_skirt_clearance.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0
      - name: Apply left-skirt clearance correction
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: python fix_v08_left_skirt_clearance.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/cad/AirMonitor_Compact_Revision_V0.8/build_v08.py
          if git diff --cached --quiet; then
            echo "Clearance fix already applied."
            exit 0
          fi
          git commit -m "Clear V0.8 lid insertion skirt from left wall"
          git pull --rebase origin cad/airmonitor-compact-v0.8
          git push origin HEAD:cad/airmonitor-compact-v0.8
