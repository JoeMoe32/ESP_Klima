name: Build final AirMonitor V0.8 edge-guided enclosure

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/build-airmonitor-v08-edge-guides-final.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrected V0.8 branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CAD and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.5.2 reportlab==4.2.5

      - name: Validate and generate corrected V0.8 files
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: |
          python check_clearances.py
          python build_v08.py
          python generate_mass_sketches_v08.py

      - name: Commit generated STEP STL SVG and PDF files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.8
          if git diff --cached --quiet; then
            echo "Corrected V0.8 outputs already current."
            exit 0
          fi
          git commit -m "Generate corrected V0.8 edge-guided CAD package"
          git pull --rebase origin cad/airmonitor-compact-v0.8
          git push origin HEAD:cad/airmonitor-compact-v0.8
