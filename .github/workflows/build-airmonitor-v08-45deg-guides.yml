name: Build AirMonitor V0.8 captured 45-degree guides

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/build-airmonitor-v08-45deg-guides.yml"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/apply_v08_45deg_side_guides.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.8 branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply captured-guide redesign
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apply_v08_45deg_side_guides.py')
          s = p.read_text(encoding='utf-8')

          # Keep literal backslash escapes intact in large regex replacements.
          s = s.replace(
              're.subn(pattern, repl, text, count=1, flags=re.S)',
              're.subn(pattern, lambda _m: repl, text, count=1, flags=re.S)',
          )

          # Restore the P03 setup line consumed together with the old guide block.
          s = s.replace(
              "# ---------------- P03 sensor pod ----------------'''",
              "# ---------------- P03 sensor pod ----------------\n"
              "px0, px1, py0, py1, pz0, pz1 = C.POD\n"
              "t = C.POD_WALL'''",
          )

          # Keep the P03 left edge exactly tangent to the inner shoulder wall:
          # 2.8 mm shoulder inset + 3.2 mm wall = X 6.0 mm.
          targeted = {
              '"SHOULDER_INSET = 2.9"': '"SHOULDER_INSET = 2.8"',
              '"SHOULDER_CORNER_R = 3.1"': '"SHOULDER_CORNER_R = 3.2"',
              '"LID_SKIRT_W = 2.6"': '"LID_SKIRT_W = 2.5"',
              'GUIDE_GROOVE_INNER_Y_FRONT = 2.85': 'GUIDE_GROOVE_INNER_Y_FRONT = 2.75',
              'GUIDE_GROOVE_OUTER_Y_FRONT = 1.65': 'GUIDE_GROOVE_OUTER_Y_FRONT = 1.60',
              'GUIDE_GROOVE_RISE = 1.20': 'GUIDE_GROOVE_RISE = 1.15',
              'GUIDE_OUTER_SKIN = 1.65': 'GUIDE_OUTER_SKIN = 1.60',
              'Schulterruecksprung     2,9 mm': 'Schulterruecksprung     2,8 mm',
              'P02 Schuerzenwand       2,6 mm': 'P02 Schuerzenwand       2,5 mm',
              'Deckelschuerze          2,60 mm': 'Deckelschuerze          2,50 mm',
              'Schulterruecksprung     2,90 mm': 'Schulterruecksprung     2,80 mm',
              'Schuerze 2,6.': 'Schuerze 2,5.',
              '2,9 zurueckgesetzt; Deckelschuerze 2,6': '2,8 zurueckgesetzt; Deckelschuerze 2,5',
              '2.85,46.4 1.65,47.6 1.65,51.4 2.85,50.2': '2.75,46.4 1.60,47.55 1.60,51.35 2.75,50.2',
              'x+2.85*s,y+1.4*s': 'x+2.75*s,y+1.4*s',
              'x+1.65*s,y+2.6*s': 'x+1.60*s,y+2.55*s',
              'x+1.65*s,y+6.4*s': 'x+1.60*s,y+6.35*s',
              'x+2.85*s,y+5.2*s': 'x+2.75*s,y+5.2*s',
              '2.6*s,10*s': '2.5*s,10*s',
              'x+2.9*s,y,4*s': 'x+2.8*s,y,4*s',
              'x+2.9*s,y+1.8*s': 'x+2.8*s,y+1.8*s',
              'x+2.0*s,y+2.7*s': 'x+1.9*s,y+2.7*s',
              'x+2.0*s,y+5.7*s': 'x+1.9*s,y+5.7*s',
              'x+2.9*s,y+4.8*s': 'x+2.8*s,y+4.8*s',
          }
          for old, new in targeted.items():
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY
          python apply_v08_45deg_side_guides.py

          # The front/right detent intentionally preloads the flexible skirt.
          # Permit only this base/lid pair and only up to 1.0 mm3; all other
          # positive intersections remain hard failures.
          python - <<'PY'
          from pathlib import Path
          p = Path('build_v08.py')
          s = p.read_text(encoding='utf-8')
          needle = "        if vol > 0.01:\n            problems.append(f'{a} ∩ {bn}: {vol:.2f} mm³')"
          repl = (
              "        pair = {a, bn}\n"
              "        if pair == {'P01_Compact_Base_Global', 'P02_Compact_Lid_Global'} and vol <= 1.0:\n"
              "            print(f'Intentional hidden snap preload: {vol:.3f} mm³')\n"
              "            continue\n"
              "        if vol > 0.01:\n"
              "            problems.append(f'{a} ∩ {bn}: {vol:.2f} mm³')"
          )
          if needle not in s:
              raise SystemExit('intersection-check anchor not found')
          p.write_text(s.replace(needle, repl, 1), encoding='utf-8')
          PY

      - name: Install CAD PDF and render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.5.2 reportlab==4.2.5 matplotlib==3.10.7 numpy==2.4.6

      - name: Validate and regenerate V0.8 package
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: |
          rm -f 02_CAD_Print/P02_Compact_Lid_Print_NO_C_V0.8.step
          rm -f 02_CAD_Print/P02_Compact_Lid_Print_NO_C_V0.8.stl
          rm -f 03_Renders_Drawings/Drawing_V08_NO_C_Open_To_Edge.svg
          rm -f LID_NO_C_VERIFICATION.txt
          python check_clearances.py
          python build_v08.py
          python generate_mass_sketches_v08.py
          python render_v08.py
          test -f 02_CAD_Print/P02_Compact_Lid_Print_45DEG_GUIDES_V0.8.stl
          test -f 03_Renders_Drawings/Render_V08_Closed.png
          test -f 03_Renders_Drawings/Render_V08_Open_8mm.png
          test -f 03_Renders_Drawings/Render_V08_Guide_Section.png
          test -f LID_45DEG_GUIDE_VERIFICATION.txt
          grep -q "External guide windows: none" LID_45DEG_GUIDE_VERIFICATION.txt

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.8
          if git diff --cached --quiet; then
            echo "V0.8 captured-guide outputs already current."
            exit 0
          fi
          git commit -m "Restore V0.8 captured slide with support-free 45-degree guides"
          git push origin HEAD:cad/airmonitor-compact-v0.8
