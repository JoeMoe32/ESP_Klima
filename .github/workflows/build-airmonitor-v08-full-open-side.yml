name: Build AirMonitor V0.8 fully open side walls

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/build-airmonitor-v08-full-open-side.yml"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/apply_v08_remove_inner_shoulder_bridge.py"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/verify_v08_full_open_side_stl.py"

permissions:
  contents: write

# Definitive rebuild: remove the hidden inner shoulder strip as well as the outer wall bridge.
jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.8 branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply complete wall and shoulder cut
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: python apply_v08_remove_inner_shoulder_bridge.py

      - name: Install CAD PDF and STL verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery==2.5.2 reportlab==4.2.5 matplotlib==3.10.7 numpy==2.4.6 pypdfium2==5.1.0 pillow==13.0.0 trimesh==4.9.0

      - name: Regenerate and verify exact V0.8 STL
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: |
          python check_clearances.py
          python build_v08.py
          python generate_mass_sketches_v08.py
          python verify_v08_mass_sketches.py
          python render_v08.py
          python verify_v08_full_open_side_stl.py
          test -f 02_CAD_Print/P01_Compact_Base_Print_FULL_OPEN_SIDE_V0.8.stl
          test -f 02_CAD_Print/P01_Compact_Base_Print_FULL_OPEN_SIDE_V0.8.step
          test -f FULL_OPEN_SIDE_STL_VERIFICATION.txt
          test -f 03_Renders_Drawings/Render_V08_Base_Full_Open_CrossSection.png
          grep -q "Recessed inner shoulder bridge: removed" SIDE_OPENING_VERIFICATION.txt
          grep -q "Full-depth bridge volume front: 0.000 mm3" SIDE_OPENING_VERIFICATION.txt
          grep -q "Full-depth bridge volume rear: 0.000 mm3" SIDE_OPENING_VERIFICATION.txt
          grep -q "no section segment enters the forbidden zone" FULL_OPEN_SIDE_STL_VERIFICATION.txt

      - name: Upload corrected V0.8 package
        uses: actions/upload-artifact@v4
        with:
          name: airmonitor-v08-full-open-side
          if-no-files-found: error
          retention-days: 7
          path: |
            hardware/cad/AirMonitor_Compact_Revision_V0.8/02_CAD_Print/P01_Compact_Base_Print_FULL_OPEN_SIDE_V0.8.stl
            hardware/cad/AirMonitor_Compact_Revision_V0.8/02_CAD_Print/P01_Compact_Base_Print_FULL_OPEN_SIDE_V0.8.step
            hardware/cad/AirMonitor_Compact_Revision_V0.8/AirMonitor_V08_Massskizzen_1zu1.pdf
            hardware/cad/AirMonitor_Compact_Revision_V0.8/03_Renders_Drawings/Render_V08_Base_Full_Open_CrossSection.png
            hardware/cad/AirMonitor_Compact_Revision_V0.8/03_Renders_Drawings/MassSketch_V08_Page02_OpenTopSide.png
            hardware/cad/AirMonitor_Compact_Revision_V0.8/SIDE_OPENING_VERIFICATION.txt
            hardware/cad/AirMonitor_Compact_Revision_V0.8/FULL_OPEN_SIDE_STL_VERIFICATION.txt

      - name: Commit corrected CAD STL STEP sketches and verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.8
          if git diff --cached --quiet; then
            echo "V0.8 complete side opening already current."
            exit 0
          fi
          git commit -m "Remove remaining inner shoulder bridge from V0.8 side openings"
          git push origin HEAD:cad/airmonitor-compact-v0.8
