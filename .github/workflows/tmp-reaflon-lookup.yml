name: Temporary Reaflon variant lookup

on:
  push:
    branches:
      - tmp/reaflon-variant-lookup
    paths:
      - ".github/workflows/tmp-reaflon-lookup.yml"

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/reaflon-variant-lookup
          fetch-depth: 0
      - name: Fetch stocked thin EPDM variants
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            'https://reaflon.ch/collections/o-ring-epdm-70-shore/products.json?limit=250' \
            -o /tmp/products.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path('/tmp/products.json').read_text())
          out = []
          pat = re.compile(r'Ø?\s*([0-9]+(?:\.[0-9]+)?)\s*x\s*([0-9]+(?:\.[0-9]+)?)\s*mm', re.I)
          for product in data.get('products', []):
              title = product.get('title', '')
              if 'EPDM 70' not in title:
                  continue
              for v in product.get('variants', []):
                  vt = v.get('title', '')
                  m = pat.search(vt)
                  if not m:
                      continue
                  inside = float(m.group(1)); cord = float(m.group(2))
                  if 35.0 <= inside <= 100.0 and cord <= 2.0:
                      out.append({
                          'product_title': title,
                          'handle': product.get('handle'),
                          'variant_id': v.get('id'),
                          'variant_title': vt,
                          'inside_diameter_mm': inside,
                          'cord_mm': cord,
                          'available': v.get('available'),
                          'price_chf_cents': v.get('price'),
                          'sku': v.get('sku'),
                      })
          out.sort(key=lambda x: (x['cord_mm'], x['inside_diameter_mm']))
          Path('reaflon_stocked_thin_o_rings.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reaflon_stocked_thin_o_rings.json
          git commit -m "Record stocked thin Reaflon EPDM O-rings"
          git push origin HEAD:tmp/reaflon-variant-lookup
