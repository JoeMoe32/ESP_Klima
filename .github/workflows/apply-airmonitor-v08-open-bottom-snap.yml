name: Apply AirMonitor V0.8 open-bottom snap

on:
  push:
    branches:
      - cad/airmonitor-compact-v0.8
    paths:
      - ".github/workflows/apply-airmonitor-v08-open-bottom-snap.yml"
      - "hardware/cad/AirMonitor_Compact_Revision_V0.8/apply_v08_open_bottom_snap_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V0.8 branch
        uses: actions/checkout@v4
        with:
          ref: cad/airmonitor-compact-v0.8
          fetch-depth: 0

      - name: Apply support-free open-bottom snap correction
        working-directory: hardware/cad/AirMonitor_Compact_Revision_V0.8
        run: python apply_v08_open_bottom_snap_patch.py

      - name: Commit corrected V0.8 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hardware/cad/AirMonitor_Compact_Revision_V0.8
          if git diff --cached --quiet; then
            echo "Open-bottom snap patch already applied."
            exit 0
          fi
          git commit -m "Replace V0.8 C-channel with support-free open-bottom snap"
          git pull --rebase origin cad/airmonitor-compact-v0.8
          git push origin HEAD:cad/airmonitor-compact-v0.8
